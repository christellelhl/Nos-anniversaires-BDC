.wrap{max-width:560px;margin:0 auto;padding:14px 14px 30px}
.glass{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:28px;box-shadow:0 8px 24px rgba(90,60,130,.18)}
.hero{text-align:center;padding:18px 14px 20px}
.hero small{display:block;color:#8e7be0;font-weight:800;font-size:22px}
h1{margin:0;font-size:clamp(34px,10vw,52px);line-height:1.05}
.sub{color:var(--mut);margin:8px 0 0;font-size:18px}
.scene{margin-top:14px;cursor:pointer;user-select:none}
.cp{animation:hop2 var(--t,3s) ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 90%}@keyframes hop2{0%,100%{transform:translateY(0) rotate(calc(var(--r,7deg)*-1))}50%{transform:translateY(-7px) rotate(var(--r,7deg))}}.flm{transform-box:fill-box;transform-origin:50% 100%;animation:flick .2s ease-in-out infinite alternate}.baby{animation:breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes breathe{50%{transform:scale(1.06)}}.ring{animation:ring 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes ring{0%,45%,100%{transform:rotate(0)}10%,30%{transform:rotate(-9deg)}20%,40%{transform:rotate(9deg)}}.wv{animation:pulse 1.2s ease-in-out infinite alternate}.rock{animation:rock 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes rock{50%{transform:rotate(2.5deg)}}.pop{position:fixed;z-index:60;background:#fff;border:4px solid var(--pc,#a99bf0);border-radius:22px;padding:10px 20px 12px;text-align:center;color:#4a3a5e;pointer-events:none;box-shadow:0 12px 34px rgba(90,60,130,.4);animation:popin 3.4s ease-out forwards;transform:translate(-50%,-110%)}
.pop b{display:block;font-size:15px}.pop .pe{font-size:28px;line-height:1}.pop .pd{font-size:24px;font-weight:900;white-space:nowrap}.pop small{color:#7a6a8c;font-weight:700}
@keyframes popin{0%{transform:translate(-50%,-70%) scale(0) rotate(-10deg);opacity:0}10%{transform:translate(-50%,-115%) scale(1.3) rotate(5deg);opacity:1}20%{transform:translate(-50%,-110%) scale(1) rotate(0)}88%{opacity:1;transform:translate(-50%,-110%) scale(1)}100%{opacity:0;transform:translate(-50%,-125%) scale(.9)}}
#sc svg{touch-action:pan-y;-webkit-user-select:none;user-select:none}.chr{cursor:pointer}
.pp{transform-box:fill-box;transform-origin:50% 100%}.jump{animation:hopj .95s ease-in-out 2}
@keyframes hopj{0%{transform:translateY(0) scale(1,1)}14%{transform:translateY(0) scale(1.08,.88)}45%{transform:translateY(-30px) scale(.94,1.1)}78%{transform:translateY(0) scale(1.06,.9)}100%{transform:translateY(0) scale(1,1)}}
.al,.ar2{transform-box:fill-box;transform-origin:50% 6%}.jump .al{animation:armL .95s ease-in-out 2}.jump .ar2{animation:armR .95s ease-in-out 2}
@keyframes armL{0%,100%{transform:rotate(0)}30%,60%{transform:rotate(150deg)}}@keyframes armR{0%,100%{transform:rotate(0)}30%,60%{transform:rotate(-150deg)}}
#flame{transform-box:fill-box;transform-origin:50% 90%}#flame.blow{animation:blowout 2.4s ease-in-out forwards}
@keyframes blowout{0%{transform:skewX(0) scale(1);opacity:1}10%{transform:skewX(-28deg) scale(1.05,.9)}22%{transform:skewX(22deg) scale(.9,.8)}34%{transform:skewX(-34deg) scale(.55,.6);opacity:.6}46%{transform:skewX(-20deg) scale(.15);opacity:0}88%{transform:scale(.15);opacity:0}94%{transform:scale(1.35,1.25);opacity:1}100%{transform:scale(1);opacity:1}}
.smoke{fill:none;stroke:#bfb3cc;stroke-width:2;stroke-linecap:round;opacity:0}.smoke.on{animation:smk 1.5s ease-out forwards}
@keyframes smk{0%{opacity:0;transform:translateY(0)}20%{opacity:.85}100%{opacity:0;transform:translateY(-18px)}}
.mbtn,#mbtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:80;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:22px;line-height:46px;padding:0;box-shadow:0 4px 14px rgba(90,60,130,.28);cursor:pointer;animation:wob 2s ease-in-out infinite}#mbtn.on,#mbtn.off{animation:none}
.glow{animation:pulse .6s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.55}to{opacity:.95}}
.stage{display:flex;flex-direction:column;align-items:center;padding-top:92px}.cups{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;margin-top:14px;width:100%}
.cupw{width:18%;max-width:84px;animation:hop var(--t,3s) ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 90%}
.cupw svg{display:block;width:100%;overflow:visible}.cupw svg.f{transform:scaleX(-1)}
.steam path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:0;animation:rise 2.6s ease-in-out infinite;filter:drop-shadow(0 0 2px rgba(200,150,230,.7))}
.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes rise{0%{transform:translateY(8px);opacity:0}35%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(calc(var(--r,8deg)*-1))}50%{transform:translateY(-14px) rotate(var(--r,8deg))}}
.cr{position:relative;width:44%;max-width:210px}
.cr img{display:block;width:100%;position:relative;z-index:1;filter:drop-shadow(0 6px 6px rgba(120,70,20,.3))}
.candle{position:absolute;z-index:0;left:46%;top:-50px;width:13px;height:80px;border-radius:5px 5px 0 0;transform:rotate(-3deg);background:repeating-linear-gradient(135deg,#f48fb1 0 7px,#fff 7px 14px);box-shadow:inset -3px 0 4px rgba(0,0,0,.14)}
.candle::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:7px;margin-left:-1px;background:#5b4545}
.fl{position:absolute;left:50%;top:-36px;width:17px;height:28px;margin-left:-8.5px;border-radius:50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 72%,#fff7b8 0,#ffd34d 38%,#ff8a2a 72%);box-shadow:0 0 18px 8px rgba(255,200,80,.65),0 0 42px 18px rgba(255,160,90,.3);transform-origin:50% 100%;animation:flick .2s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
.card.today{box-shadow:0 0 0 3px #ffd34d,0 0 28px rgba(255,200,60,.85)}@keyframes wob{50%{transform:scale(1.025)}}.crown{display:inline-block;animation:wob 1s ease-in-out infinite}
.next{margin-top:14px;padding:12px 10px 14px;border-radius:22px;background:var(--chip);font-weight:700;text-align:center}
.nt{font-size:13px;color:var(--mut)}.nn{font-size:19px;margin:2px 0 9px}
.cd{display:flex;gap:8px;justify-content:center}.cd div{min-width:62px;padding:6px 4px 5px;border-radius:14px;background:#fff;border:2px solid var(--c,#a99bf0);box-shadow:0 3px 8px rgba(90,60,130,.15)}
.cd b{display:block;font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}.cd small{font-size:11px;color:var(--mut);font-weight:700}
.next.today{background:linear-gradient(120deg,#fff6c8,#ffe3f0,#dcefff,#fff6c8);background-size:300% 100%;animation:shine 5s linear infinite;border:3px solid #ffd34d;box-shadow:0 0 26px rgba(255,200,60,.8)}
@keyframes shine{to{background-position:300% 0}}
.hb{font-size:15px;color:#7a5a2a}.hn{font-size:36px;font-weight:900;line-height:1.15;margin:2px 0;background:linear-gradient(90deg,#ff8fb8,#ffae7d,#f0c030,#7fd9bc,#6fbdf0,#a99bf0);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;animation:wob 1.6s ease-in-out infinite}
.hs{font-size:17px;color:#8e7be0}
.card.nextc{outline:2.5px dashed var(--pc);outline-offset:-3px}
.card.today{background:linear-gradient(110deg,#fff8d6,#ffe6f1,#e3f1ff,#fff8d6);background-size:300% 100%;animation:wob 1.8s ease-in-out infinite,shine 6s linear infinite;border:3px solid #ffd34d;padding-top:16px;padding-bottom:16px}
.card.today .nm{font-size:24px}.chip.hon{background:linear-gradient(90deg,#ffe27a,#ffc2dc);color:#5a3a2a}
.bl{animation:flt 2.6s ease-in-out infinite alternate}@keyframes flt{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:twk 1.3s ease-in-out infinite alternate}@keyframes twk{from{opacity:.25}to{opacity:1}}
.card{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-top:10px}
.edit .card{cursor:pointer}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.mid{flex:1;min-width:0}.nm{font-weight:800;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:13px;align-items:center}
.chip{padding:3px 10px;border-radius:99px;background:var(--chip);font-weight:700}
.dt{flex:none;text-align:center;padding:7px 12px;border-radius:99px;color:#fff;font-weight:800;font-size:14px;line-height:1.25}
.dt small{display:block;font-weight:600;font-size:11px;opacity:.92}
.dt.e{background:var(--chip)!important;color:var(--mut)}
