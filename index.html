const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(pw){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(S),iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pl=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(I)},k,u8(D));
 return new TextDecoder().decode(pl)}
function open_(h){document.open();document.write(h);document.close()}
const er=document.getElementById('er');
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();er.textContent='';
 const pw=document.getElementById('p').value.trim();if(!pw)return;
 try{if(!window.crypto||!crypto.subtle)throw 1;const h=await go(pw);try{localStorage.setItem('bdcpw',pw)}catch(x){}open_(h)}
 catch(x){er.textContent=(window.crypto&&crypto.subtle)?'Mot de passe incorrect 🙈':'Ouvre le lien dans Safari ou Chrome'}});
(async()=>{try{const pw=localStorage.getItem('bdcpw');if(pw){open_(await go(pw))}}catch(x){try{localStorage.removeItem('bdcpw')}catch(y){}}})();
})();
